<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пинг Понг</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            color: white;
        }
        #score {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 36px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        canvas {
            background-color: #000;
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .instructions {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
            font-size: 18px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="score">0 : 0</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="instructions">
        Игрок 1: W (вверх) / S (вниз)<br>
        Игрок 2: Стрелка вверх / Стрелка вниз
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDiv = document.getElementById('score');
        
        // Константы
        const PADDLE_WIDTH = 10;
        const PADDLE_HEIGHT = 100;
        const PADDLE_SPEED = 6;
        const BALL_RADIUS = 8;
        let ballSpeedX = 4; // Будет установлен после счета
        let ballSpeedY = 4;
        
        // Состояние игры
        let leftPaddleY = (canvas.height - PADDLE_HEIGHT) / 2;
        let rightPaddleY = (canvas.height - PADDLE_HEIGHT) / 2;
        let ballX = canvas.width / 2;
        let ballY = canvas.height / 2;
        let leftScore = 0;
        let rightScore = 0;
        
        // Отслеживание нажатых клавиш
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);
        
        // Обновление счета
        function updateScore() {
            scoreDiv.textContent = `${leftScore} : ${rightScore}`;
        }
        
        // Сброс позиции мяча
        function resetBall() {
            ballX = canvas.width / 2;
            ballY = canvas.height / 2;
            // Случайное вертикальное направление после счета
            ballSpeedY = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 2);
        }
        
        // Основной игровой цикл
        function gameLoop() {
            // Очистка канваса
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Движение ракеток
            if (keys['w'] || keys['W']) leftPaddleY -= PADDLE_SPEED;
            if (keys['s'] || keys['S']) leftPaddleY += PADDLE_SPEED;
            if (keys['ArrowUp']) rightPaddleY -= PADDLE_SPEED;
            if (keys['ArrowDown']) rightPaddleY += PADDLE_SPEED;
            
            // Ограничение движения ракеток по канвасу
            leftPaddleY = Math.max(0, Math.min(canvas.height - PADDLE_HEIGHT, leftPaddleY));
            rightPaddleY = Math.max(0, Math.min(canvas.height - PADDLE_HEIGHT, rightPaddleY));
            
            // Движение мяча
            ballX += ballSpeedX;
            ballY += ballSpeedY;
            
            // Отскок от верхней и нижней границ
            if (ballY - BALL_RADIUS < 0 || ballY + BALL_RADIUS > canvas.height) {
                ballSpeedY = -ballSpeedY;
            }
            
            // Проверка столкновения с левой ракеткой
            if (ballX - BALL_RADIUS < PADDLE_WIDTH) {
                if (ballY > leftPaddleY && ballY < leftPaddleY + PADDLE_HEIGHT) {
                    ballSpeedX = -ballSpeedX * 1.05; // Небольшое ускорение после отскока
                    // Добавляем эффект в зависимости от места попадания
                    const hitPos = (ballY - (leftPaddleY + PADDLE_HEIGHT/2)) / (PADDLE_HEIGHT/2);
                    ballSpeedY += hitPos * 2;
                } else {
                    // Очко для правого игрока
                    rightScore++;
                    updateScore();
                    ballSpeedX = 4; // Мяч движется влево к левому игроку
                    resetBall();
                }
            }
            
            // Проверка столкновения с правой ракеткой
            if (ballX + BALL_RADIUS > canvas.width - PADDLE_WIDTH) {
                if (ballY > rightPaddleY && ballY < rightPaddleY + PADDLE_HEIGHT) {
                    ballSpeedX = -ballSpeedX * 1.05;
                    const hitPos = (ballY - (rightPaddleY + PADDLE_HEIGHT/2)) / (PADDLE_HEIGHT/2);
                    ballSpeedY += hitPos * 2;
                } else {
                    // Очко для левого игрока
                    leftScore++;
                    updateScore();
                    ballSpeedX = -4; // Мяч движется вправо к правому игроку
                    resetBall();
                }
            }
            
            // Отрисовка ракеток
            ctx.fillStyle = '#00ff9f';
            ctx.fillRect(0, leftPaddleY, PADDLE_WIDTH, PADDLE_HEIGHT);
            ctx.fillRect(canvas.width - PADDLE_WIDTH, rightPaddleY, PADDLE_WIDTH, PADDLE_HEIGHT);
            
            // Отрисовка мяча с эффектом свечения
            ctx.beginPath();
            ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = 'rgba(255, 107, 107, 0.7)';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0; // Сброс тени для остальных элементов
            
            // Центральная линия
            ctx.beginPath();
            ctx.setLineDash([10, 10]);
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Запрос следующего кадра
            requestAnimationFrame(gameLoop);
        }
        
        // Запуск игры
        updateScore();
        resetBall();
        gameLoop();
    </script>
</body>
</html>
